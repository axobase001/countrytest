name: deribit-ws-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install websockets
      - name: Probe WebSocket RPC
        run: |
          python - <<'PY'
          import asyncio, json, datetime
          import websockets

          async def rpc(url, method, params, timeout=25):
              try:
                  async with websockets.connect(url, open_timeout=timeout, close_timeout=5, ping_interval=None, max_size=64*1024*1024) as ws:
                      req={'jsonrpc':'2.0','id':1,'method':method,'params':params}
                      await ws.send(json.dumps(req))
                      raw=await asyncio.wait_for(ws.recv(),timeout=timeout)
                      obj=json.loads(raw)
                      if 'error' in obj:
                          print('RPC_ERROR',url,method,obj['error']); return None
                      return obj.get('result')
              except Exception as e:
                  print('WS_ERROR',url,method,repr(e)); return None

          async def main():
              urls=['wss://www.deribit.com/ws/api/v2','wss://history.deribit.com/ws/api/v2']
              for url in urls:
                  for expired in (True,False):
                      r=await rpc(url,'public/get_instruments',{'currency':'ETH','kind':'option','expired':expired})
                      if isinstance(r,list):
                          ex=[x.get('expiration_timestamp') for x in r if x.get('expiration_timestamp')]
                          cr=[x.get('creation_timestamp') for x in r if x.get('creation_timestamp')]
                          print('INSTR',url,'expired',expired,'count',len(r),'min_exp',min(ex) if ex else None,'max_exp',max(ex) if ex else None,'min_creation',min(cr) if cr else None,'max_creation',max(cr) if cr else None)
                          # candidates expiring in May-Aug 2026
                          lo=1777593600000; hi=1788134400000
                          cand=[x for x in r if lo <= int(x.get('expiration_timestamp') or 0) <= hi]
                          print('WINDOW_CAND',len(cand),[x.get('instrument_name') for x in cand[:8]])
                          if cand:
                              name=cand[len(cand)//2]['instrument_name']
                              t0=1778803200000; t1=1786751999000
                              tr=await rpc(url,'public/get_last_trades_by_instrument_and_time',{'instrument_name':name,'start_timestamp':t0,'end_timestamp':t1,'count':10,'sorting':'asc'})
                              print('TRADE_PROBE',url,name,'type',type(tr).__name__,'value',str(tr)[:3000])
          asyncio.run(main())
          PY
