name: deribit-ws-probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install requests
      - name: Probe Tardis archive access
        run: |
          python - <<'PY'
          import requests, gzip, io
          urls=[
            'https://datasets.tardis.dev/v1/deribit/trades/2026/06/01/OPTIONS.csv.gz',
            'https://datasets.tardis.dev/v1/deribit/trades/2026/06/15/OPTIONS.csv.gz',
            'https://datasets.tardis.dev/v1/deribit/options_chain/2026/06/01/OPTIONS.csv.gz',
            'https://datasets.tardis.dev/v1/deribit/options_chain/2026/06/15/OPTIONS.csv.gz',
            'https://datasets.tardis.dev/v1/deribit/trades/2026/07/15/OPTIONS.csv.gz',
          ]
          for u in urls:
              try:
                  r=requests.get(u,headers={'Range':'bytes=0-65535'},timeout=40,allow_redirects=True)
                  print('URL',u,'status',r.status_code,'len',len(r.content),'ctype',r.headers.get('content-type'),'crange',r.headers.get('content-range'))
                  print('body_head',repr(r.content[:200]))
                  if r.status_code in (200,206) and r.content[:2]==b'\x1f\x8b':
                      try:
                          txt=gzip.GzipFile(fileobj=io.BytesIO(r.content)).read(5000)
                          print('gzip_head',repr(txt[:2000]))
                      except Exception as e: print('partial_gzip',repr(e))
              except Exception as e: print('ERR',u,repr(e))
          PY
