name: main-sequence-eth-three-shot
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "${{ github.workspace }}/source"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  FROZEN_SHA: "5421d7d55a461c7974a78898e08fcc6781eb2827"
jobs:
  eth15m_core:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          repository: axobase001/test
          ref: 5421d7d55a461c7974a78898e08fcc6781eb2827
          path: source
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: ETH 15m CORE
        working-directory: source
        run: python main_sequence/eth15m_conservative_replay_audited.py --start 2026-05-15 --end 2026-08-15 --out eth15m_out --workers 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-three-shot-15m-core
          path: |
            source/eth15m_out/summary.json
            source/eth15m_out/trades.csv
            source/eth15m_out/inventory.csv
            source/eth15m_out/daily_density.csv
            source/eth15m_out/market_rv.csv
          if-no-files-found: warn
          retention-days: 7

  eth5m_tail:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          repository: axobase001/test
          ref: 5421d7d55a461c7974a78898e08fcc6781eb2827
          path: source
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install requests duckdb scipy pandas pyarrow numpy huggingface_hub hf_xet
      - name: DuckDB reserved-word compatibility
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('main_sequence/eth5m_chainlink_tail_audited.py')
          s=p.read_text()
          old='CAST(full AS VARCHAR) AS full'
          new='CAST("full" AS VARCHAR) AS "full"'
          assert old in s
          p.write_text(s.replace(old,new))
          PY
      - name: ETH 5m TAIL
        working-directory: source
        run: python main_sequence/eth5m_chainlink_tail_final.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-three-shot-5m-tail
          path: |
            source/eth5m_tail_out/market_rows.csv
            source/eth5m_tail_out/surface.csv
            source/eth5m_tail_out/manifest.json
            source/eth5m_tail_out/gamma_resolutions.csv
          if-no-files-found: warn
          retention-days: 7

  eth1h_core:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          repository: axobase001/test
          ref: 5421d7d55a461c7974a78898e08fcc6781eb2827
          path: source
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install 'honest-backtest[parquet]==0.2.0' requests scipy pandas pyarrow numpy
      - name: ETH 1h CORE
        working-directory: source
        run: python main_sequence/eth1h_strict3_core_causal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-three-shot-1h-core
          path: |
            source/eth1h_strict3_out/summary.json
            source/eth1h_strict3_out/events.csv
            source/eth1h_strict3_out/market_summary.csv
            source/eth1h_strict3_out/inventory.csv
          if-no-files-found: warn
          retention-days: 7
