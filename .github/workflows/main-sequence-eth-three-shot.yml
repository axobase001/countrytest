name: main-sequence-eth-three-shot
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "${{ github.workspace }}/source"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  FROZEN_SHA: "5421d7d55a461c7974a78898e08fcc6781eb2827"
jobs:
  eth15m_core:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "temporarily paused while Deribit public metadata endpoint returns 503"

  eth1h_core:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "temporarily paused while Deribit public metadata endpoint returns 503"

  eth5m_tail:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          repository: axobase001/test
          ref: 5421d7d55a461c7974a78898e08fcc6781eb2827
          path: source
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install requests duckdb scipy pandas pyarrow numpy huggingface_hub hf_xet
      - name: DuckDB reserved-word compatibility
        working-directory: source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('main_sequence/eth5m_chainlink_tail_audited.py')
          s=p.read_text(); old='CAST(full AS VARCHAR) AS full'; new='CAST("full" AS VARCHAR) AS "full"'
          if old in s: p.write_text(s.replace(old,new))
          PY
      - name: ETH 5m TAIL capture-clock qualification
        working-directory: source
        run: |
          cat > /tmp/run_eth5m_capture.py <<'PY'
          import json
          from pathlib import Path
          from main_sequence import eth5m_chainlink_tail as base
          original_load = base.load_chainlink
          from main_sequence import eth5m_chainlink_tail_final as final
          qualified = final.qualified
          audited = qualified.audited
          runner = audited.runner

          class CaptureClockAdapter:
              def __init__(self, ps): self.ps = ps
              def at_source_time(self, target_source_ms, available_by_ms, max_source_staleness_ms=5000):
                  px, ts = self.ps.at(int(target_source_ms), int(max_source_staleness_ms))
                  if ts < 0 or ts > int(available_by_ms): return float('nan'), -1, -1
                  return float(px), int(ts), int(ts)
              def latest_available(self, available_by_ms, max_capture_lag_ms=5000, max_source_age_ms=5000):
                  tol=min(int(max_capture_lag_ms), int(max_source_age_ms))
                  px, ts = self.ps.at(int(available_by_ms), tol)
                  if ts < 0: return float('nan'), -1, -1
                  return float(px), int(ts), int(ts)
              def rv(self, available_by_ms, source_target_ms=None, minutes=60, min_obs=30):
                  return self.ps.rv(int(available_by_ms), minutes=int(minutes), min_obs=int(min_obs))

          def load_capture_clock(paths):
              ps = original_load(paths)
              n=int(len(ps.ts))
              audited._DUAL_CLOCK_AUDIT.clear()
              audited._DUAL_CLOCK_AUDIT.update({
                  'chainlink_rows': n,
                  'payload_source_timestamp_parsed': 0,
                  'payload_source_timestamp_parse_rate': 0.0,
                  'source_clock_rows_within_5s_of_capture': 0,
                  'source_clock_valid_rate': 0.0,
                  'source_after_capture_rows': None,
                  'capture_minus_source_ms_median': None,
                  'capture_minus_source_ms_p95_abs': None,
                  'policy': 'source timestamp absent in archive; economics replayed on collector capture clock only',
                  'qualification_effect': 'overall grade cannot exceed YELLOW_SOURCE_CLOCK',
              })
              return CaptureClockAdapter(ps)

          runner.load_chainlink = load_capture_clock
          runner.one_market_rows = final.one_market_rows_common_t90
          qualified.daily_pnl_stats = final.market_start_daily_pnl_stats
          runner.main()
          qualified.postprocess()
          p=Path('eth5m_tail_out/manifest.json')
          if p.exists():
              m=json.loads(p.read_text())
              qa=m.setdefault('qualification_audit',{})
              qa['chainlink_time_mode']='capture_clock_only'
              qa['source_timestamp_available_in_archive']=False
              qa['source_clock_claimed_or_imputed']=False
              qa['decision_clock']='single common T-90'
              p.write_text(json.dumps(m,indent=2))
          PY
          python /tmp/run_eth5m_capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-three-shot-5m-tail
          path: |
            source/eth5m_tail_out/market_rows.csv
            source/eth5m_tail_out/surface.csv
            source/eth5m_tail_out/manifest.json
            source/eth5m_tail_out/gamma_resolutions.csv
          if-no-files-found: warn
          retention-days: 7
